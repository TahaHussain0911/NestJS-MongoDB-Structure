name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS app
        run: npm run build

      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            dist/ \
            package.json \
            package-lock.json \
            ecosystem.config.cjs

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          PORT: ${{ secrets.PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          FRONTEND_SUCCESS_URL: ${{ secrets.FRONTEND_SUCCESS_URL }}
          FRONTEND_CANCEL_URL: ${{ secrets.FRONTEND_CANCEL_URL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          # Write .env on CI runner where secrets are available
          cat > .env << ENDENV
          NODE_ENV=production
          PORT=$PORT
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET=$JWT_SECRET
          JWT_EXPIRES_IN=$JWT_EXPIRES_IN
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          AWS_S3_REGION=$AWS_S3_REGION
          AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME
          AWS_S3_ACCESS_KEY_ID=$AWS_S3_ACCESS_KEY_ID
          AWS_S3_SECRET_KEY=$AWS_S3_SECRET_KEY
          STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
          STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET
          FRONTEND_SUCCESS_URL=$FRONTEND_SUCCESS_URL
          FRONTEND_CANCEL_URL=$FRONTEND_CANCEL_URL
          SMTP_EMAIL=$SMTP_EMAIL
          SMTP_HOST=$SMTP_HOST
          SMTP_PASSWORD=$SMTP_PASSWORD
          BASE_URL=$BASE_URL
          ENDENV

          # Copy deployment package and .env to EC2
          scp deploy.tar.gz .env ${EC2_USERNAME}@${EC2_HOST}:/tmp/

          # SSH into EC2 and deploy
          ssh ${EC2_USERNAME}@${EC2_HOST} << 'ENDSSH'

            cd /var/www/nestjs-app

            # Fix ownership
            sudo chown -R $USER:$USER /var/www/nestjs-app

            # Backup current version
            if [ -d "dist" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf backups/backup_${timestamp}.tar.gz dist package.json ecosystem.config.cjs .env 2>/dev/null || true
              # Keep only last 5 backups
              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi

            # Extract new version
            echo "Extracting deployment package..."
            tar --overwrite -xzf /tmp/deploy.tar.gz -C /var/www/nestjs-app
            rm /tmp/deploy.tar.gz

            # Move .env into place (always overwrite to keep secrets in sync)
            mv /tmp/.env /var/www/nestjs-app/.env

            # Fix ownership after extraction
            sudo chown -R $USER:$USER /var/www/nestjs-app

            # Install production dependencies only (no build needed — dist/ already compiled)
            echo "Installing production dependencies..."
            npm ci --omit=dev

            # Create logs directory
            mkdir -p logs

            # Zero-downtime reload with PM2
            if pm2 describe nestjs-app > /dev/null 2>&1; then
              echo "Reloading PM2 app (zero-downtime)..."
              pm2 reload ecosystem.config.cjs --update-env
            else
              echo "Starting new PM2 process..."
              pm2 start ecosystem.config.cjs
            fi

            # Save PM2 process list
            pm2 save

            ENDSSH

          # Cleanup local .env
          rm .env