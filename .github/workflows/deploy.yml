name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: NODE_OPTIONS="--max-old-space-size=1536" npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package*.json deploy/
          cp ecosystem.config.js deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Setup SSH private key
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Write .env file to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: private_key.pem
          port: 22
          script: |
            printf 'PORT=%s\n' '${{ secrets.PORT }}' > /var/www/nestjs-app/.env
            printf 'DATABASE_URL=%s\n' '${{ secrets.DATABASE_URL }}' >> /var/www/nestjs-app/.env
            printf 'JWT_SECRET=%s\n' '${{ secrets.JWT_SECRET }}' >> /var/www/nestjs-app/.env
            printf 'JWT_EXPIRES_IN=%s\n' '${{ secrets.JWT_EXPIRES_IN }}' >> /var/www/nestjs-app/.env
            printf 'JWT_REFRESH_SECRET=%s\n' '${{ secrets.JWT_REFRESH_SECRET }}' >> /var/www/nestjs-app/.env
            printf 'AWS_S3_REGION=%s\n' '${{ secrets.AWS_S3_REGION }}' >> /var/www/nestjs-app/.env
            printf 'AWS_S3_BUCKET_NAME=%s\n' '${{ secrets.AWS_S3_BUCKET_NAME }}' >> /var/www/nestjs-app/.env
            printf 'AWS_S3_ACCESS_KEY_ID=%s\n' '${{ secrets.AWS_S3_ACCESS_KEY_ID }}' >> /var/www/nestjs-app/.env
            printf 'AWS_S3_SECRET_KEY=%s\n' '${{ secrets.AWS_S3_SECRET_KEY }}' >> /var/www/nestjs-app/.env
            printf 'STRIPE_SECRET_KEY=%s\n' '${{ secrets.STRIPE_SECRET_KEY }}' >> /var/www/nestjs-app/.env
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' '${{ secrets.STRIPE_WEBHOOK_SECRET }}' >> /var/www/nestjs-app/.env
            printf 'FRONTEND_SUCCESS_URL=%s\n' '${{ secrets.FRONTEND_SUCCESS_URL }}' >> /var/www/nestjs-app/.env
            printf 'FRONTEND_CANCEL_URL=%s\n' '${{ secrets.FRONTEND_CANCEL_URL }}' >> /var/www/nestjs-app/.env
            printf 'SMTP_EMAIL=%s\n' '${{ secrets.SMTP_EMAIL }}' >> /var/www/nestjs-app/.env
            printf 'SMTP_HOST=%s\n' '${{ secrets.SMTP_HOST }}' >> /var/www/nestjs-app/.env
            printf 'SMTP_PASSWORD=%s\n' '${{ secrets.SMTP_PASSWORD }}' >> /var/www/nestjs-app/.env
            printf 'BASE_URL=%s\n' '${{ secrets.BASE_URL }}' >> /var/www/nestjs-app/.env

      - name: Copy deployment package to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/
          rm private_key.pem

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: private_key.pem
          port: 22
          script: |
            cd /var/www/nestjs-app

            # Fix ownership
            sudo chown -R $USER:$USER /var/www/nestjs-app

            # Backup current version
            if [ -d "dist" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf backups/backup_${timestamp}.tar.gz dist package.json ecosystem.config.js .env 2>/dev/null || true
              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi

            # Extract new build
            tar --overwrite -xzf /tmp/deploy.tar.gz -C /var/www/nestjs-app
            rm /tmp/deploy.tar.gz

            # Fix ownership after extraction
            sudo chown -R $USER:$USER /var/www/nestjs-app

            # Install production dependencies
            npm ci --omit=dev

            mkdir -p logs

            # Reload or start PM2
            if pm2 describe nestjs-app > /dev/null 2>&1; then
              echo "Reloading PM2 (zero-downtime)..."
              pm2 reload ecosystem.config.js --update-env
            else
              echo "Starting PM2 fresh..."
              pm2 start ecosystem.config.js
            fi

            pm2 save

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Waiting for app to start..."
          sleep 10

          for i in {1..3}; do
            echo "Attempt $i of 3..."
            response=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST} 2>/dev/null || echo "000")

            if [ "$response" = "200" ] || [ "$response" = "301" ] || [ "$response" = "302" ]; then
              echo "✅ Deployment successful! Status: $response"
              exit 0
            fi

            echo "Got: $response, retrying in 5s..."
            sleep 5
          done

          echo "❌ Verification failed - check PM2 logs on server"
          exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: private_key.pem
          port: 22
          script: |
            echo "🔄 Rolling back to previous version..."
            cd /var/www/nestjs-app
            sudo chown -R $USER:$USER /var/www/nestjs-app

            latest_backup=$(ls -t backups/backup_*.tar.gz 2>/dev/null | head -1)

            if [ -n "$latest_backup" ]; then
              echo "Restoring: $latest_backup"
              tar -xzf "$latest_backup" -C /var/www/nestjs-app
              npm ci --omit=dev
              pm2 reload ecosystem.config.js
              echo "✅ Rollback successful"
            else
              echo "⚠️ No backup found"
            fi